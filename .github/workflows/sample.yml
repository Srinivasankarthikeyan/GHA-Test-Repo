# .github/workflows/01-basics.yml
name: 01 - Basics and Contexts

# Triggers: manual, on push to main, and on PR
on:
  workflow_dispatch: # Allows manual triggering from the UI
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  print-context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print GitHub Context
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Input Environment: ${{ inputs.environment }}"

      - name: Conditional Step (Expression)
        # This step only runs if the manual input is 'production'
        if: ${{ inputs.environment == 'production' }}
        run: echo "Running production-specific tasks!"
